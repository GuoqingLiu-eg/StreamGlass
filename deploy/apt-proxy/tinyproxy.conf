User tinyproxy
Group tinyproxy
Port 3128
Listen 0.0.0.0
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"
MaxClients 32
StartServers 4
MinSpareServers 2
MaxSpareServers 8
Allow 192.168.0.0/16
ConnectPort 443
ConnectPort 563

